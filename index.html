<style>
:root{
  --ink:#111;--mid:#5f6368;--low:#80868b;--line:#e3e3e3;--line-strong:#111;
  --bg:#fff;--red:#e52222;
  --serif:"Marcellus","Trajan Pro","Optima",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans Devanagari",system-ui,sans-serif;
  --pad:clamp(20px,7vw,120px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=hi] body{font-family:"Noto Sans Devanagari",var(--sans)}
html[lang=hi] .strip,html[lang=hi] nav a,html[lang=hi] .btn{letter-spacing:0;font-size:14px;font-weight:500}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* top strip */
.strip{flex:none;display:flex;align-items:center;justify-content:center;position:relative;
  height:38px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 44px;text-align:center}
.strip a{text-decoration:underline;text-underline-offset:3px}
.strip .x{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;font-size:18px;color:var(--mid)}
.strip.gone{display:none}

/* header */
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:24px;
  height:76px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .mark{width:26px;height:26px;flex:none;display:block}
@media (max-width:640px){.brand .mark{width:22px;height:22px}}
@media (max-width:360px){.brand span{display:none}}
nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,36px)}
nav a,.lang button{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
nav a:hover{text-decoration:underline;text-underline-offset:6px}
.lang{display:flex;align-items:center;gap:6px;color:var(--low)}
.lang button{color:var(--low);letter-spacing:.08em}
.lang button[aria-pressed=true]{color:var(--ink)}
.cta{position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 26px;
  font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  border:1px solid var(--ink);background:var(--bg);color:var(--ink);transition:background .15s,color .15s}
.btn:hover{background:#f4f4f4}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#333}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:#fff;border:1px solid var(--ink);display:none;z-index:30}
.menu.open{display:block}
.menu a{display:block;padding:12px 18px;font-size:14px}
.menu a+a{border-top:1px solid var(--line)}
.menu a:hover{background:#f4f4f4}

/* main */
main{flex:1 0 auto;display:flex;flex-direction:column;
  padding:clamp(12px,3vh,40px) var(--pad);width:100%;max-width:1480px;margin:0 auto}
.inner{width:100%;max-width:1200px;margin:auto}
h1{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:1.08;letter-spacing:.01em;white-space:pre-line;
  font-size:clamp(28px,min(4.6vw,6.4vh),62px)}
html[lang=hi] h1{font-family:"Noto Sans Devanagari",var(--serif);text-transform:none;font-weight:500}
.sub{margin-top:clamp(6px,1.2vh,14px);color:var(--mid);font-size:clamp(14px,1.9vh,17px);max-width:80ch}

.search{position:relative;margin-top:clamp(16px,3.6vh,44px)}
.bar{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line-strong)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);
  font-size:clamp(19px,min(2.6vw,4vh),34px);padding:clamp(4px,1vh,12px) 0;letter-spacing:-.005em}
.bar input::placeholder{color:#9aa0a6}
.go{flex:none;width:clamp(44px,6.2vh,60px);height:clamp(44px,6.2vh,60px);background:var(--ink);color:#fff;font-size:22px;margin-bottom:8px}
.go:hover{background:#333}
.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-top:0;
  box-shadow:0 12px 32px rgba(0,0,0,.08);z-index:20;display:none;max-height:min(420px,52vh);overflow:auto}
.results.open{display:block}
.r{display:flex;align-items:baseline;gap:14px;padding:12px 18px;cursor:pointer}
.r+.r{border-top:1px solid #f1f1f1}
.r[aria-selected=true],.r:hover{background:#f6f6f6}
.r .t{flex:1;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t mark{background:none;font-weight:600;color:inherit}
.r .k{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;margin-top:clamp(10px,1.8vh,18px);color:var(--mid);font-size:14px}
.chip{height:34px;padding:0 16px;border:1px solid var(--line);font-size:14px;color:var(--mid)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.hint{margin-top:clamp(6px,1.2vh,12px);color:var(--low);font-size:13.5px}

.label{color:var(--mid);font-size:14px;margin-bottom:clamp(6px,1.2vh,12px)}
.quick{margin-top:clamp(14px,3.2vh,40px)}
.qrow{display:flex;flex-wrap:wrap;gap:12px}

.asked{margin-top:clamp(14px,3.2vh,40px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:clamp(24px,4vw,64px)}
.item{display:block;padding:clamp(8px,1.5vh,16px) 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:400;font-size:clamp(15px,2vh,18px);color:var(--ink)}
.item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:var(--mid);font-size:clamp(13px,1.7vh,15px);line-height:1.5}
.item:hover b{text-decoration:underline;text-underline-offset:4px}


/* tabs */
.tabs{display:flex;gap:clamp(14px,2.2vw,30px);margin-bottom:0;border-bottom:1px solid var(--line)}
.tab{position:relative;padding:0 0 clamp(6px,1vh,10px);font-size:14px;color:var(--mid);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.tab:hover{color:var(--ink)}
.item{cursor:pointer;text-align:left;width:100%;display:flex!important;flex-direction:column;justify-content:flex-start;align-items:stretch;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit}
.item b,.item span{width:100%}
.item b:after{content:" \2192";opacity:0;transition:opacity .15s}
.item:hover b:after,.item:focus-visible b:after{opacity:1}
.grid{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;border-left:1px solid var(--ink)}
.sheet.open{transform:none}
.sh-top{flex:none;display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 28px;border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.sh-k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.sh-x{width:36px;height:36px;font-size:24px}
.sh-body{flex:1;overflow:auto;padding:28px 28px 20px}
.sh-body h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.1;text-transform:uppercase;margin-bottom:16px}
html[lang=hi] .sh-body h2{font-family:"Noto Sans Devanagari",var(--serif);text-transform:none;font-weight:500}
.sh-body p{color:#333;font-size:16px;margin-bottom:12px;max-width:52ch}
.sh-body p.em{color:var(--ink);font-weight:600}
.sh-body .sh-lt{margin:22px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sh-list a,.sh-list div{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.sh-list b{display:block;font-weight:500;font-size:16px}
.sh-list span{display:block;color:var(--mid);font-size:14.5px}
.sh-list a:hover b{text-decoration:underline;text-underline-offset:4px}
.sh-act{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:16px 28px;border-top:1px solid var(--line);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sh-rel{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
body.lock{overflow:hidden}

footer{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;
  padding:14px var(--pad);border-top:1px solid var(--line);font-size:12.5px;color:var(--low)}
footer .links{display:flex;gap:18px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}

/* short screens: keep everything in one frame */
@media (max-height:940px){.hint{display:none}}
@media (max-height:860px){.item span{-webkit-line-clamp:1}}
@media (max-height:800px){.quick,.asked{margin-top:clamp(14px,3.4vh,26px)}}
@media (max-height:660px){.item span{display:none}}
@media (max-height:790px){.sub{display:none}.strip{height:32px}header{height:64px}}


/* tablet */
@media (max-width:1320px){.qrow{gap:10px}.qrow .btn{padding:0 16px;letter-spacing:.12em}}
@media (max-width:1180px) and (min-width:641px){.qrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.qrow::-webkit-scrollbar{display:none}.qrow .btn{flex:none}}
@media (max-width:1100px){nav .opt{display:none}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hint{display:none}}

/* phone */
@media (max-width:640px){
  body{font-size:14px}
  .strip{font-size:10px;letter-spacing:.1em;height:32px}
  header{height:60px;padding:0 18px}
  .brand{font-size:16px}
  nav{gap:10px}
  nav a{display:none}
  .menu a{display:block}
  .lang .sep,.lang button[aria-pressed=true]{display:none}
  .lang button{font-size:13px;padding:6px 4px}
  .strip .s2{display:none}
  .btn{height:40px;padding:0 14px;font-size:11px;letter-spacing:.12em}
  main{padding:14px 18px;justify-content:flex-start;padding-top:clamp(14px,4vh,40px)}
  h1{font-size:clamp(28px,8.4vw,40px)}
  .sub{font-size:14px}
  .hint{display:none}
  .quick .qrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
  .quick .qrow::-webkit-scrollbar{display:none}
  .tabs{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
  .tabs::-webkit-scrollbar{display:none}
  .grid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none;margin:0 -18px;padding:4px 18px 2px}
  .grid::-webkit-scrollbar{display:none}
  .grid .item,.grid .item:nth-child(n+4){display:block;flex:0 0 78%;scroll-snap-align:start;border:1px solid var(--line);padding:14px 16px}
  .item span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .sheet{top:auto;height:88dvh;width:100%;transform:translateY(100%);border-left:0;border-top:1px solid var(--ink)}
  .sh-top{height:56px;padding:0 20px;padding-top:0}
  .sh-body{padding:22px 20px 16px}
  .sh-act{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
  .sh-act .btn{flex:1 1 auto}
  footer{padding:10px 18px;font-size:11px}
  footer .links{display:none}
}
@media (max-width:640px) and (max-height:760px){.sub{display:none}.item span{-webkit-line-clamp:2}}
@media (max-width:640px) and (max-height:680px){.item span{-webkit-line-clamp:1}.label{display:none}}

/* ===== calm layout (Google-like): one centred column, one search, four actions ===== */
header{border-bottom:0;height:68px}
nav{gap:clamp(14px,2vw,26px)}
nav a{letter-spacing:.06em;text-transform:none;font-size:14px}
html[lang=hi] nav a{font-size:14px}
.langT{font-size:14px;color:var(--mid)}
.langT:hover{color:var(--ink)}
header .btn{height:40px;padding:0 18px;font-size:12px;border-radius:20px}
.menu{border-radius:12px;overflow:hidden}
main{justify-content:center}
.inner{max-width:720px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
h1{white-space:normal;max-width:none;text-transform:none;font-size:clamp(28px,min(3.7vw,6vh),46px);line-height:1.15;letter-spacing:0}
.search{width:100%;margin-top:clamp(22px,4.5vh,40px);text-align:left}
.bar{border:1px solid #dfe1e5;border-radius:28px;padding:0 6px 0 18px;height:54px;gap:10px;transition:box-shadow .15s,border-color .15s}
.bar:hover,.bar:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.sico{width:20px;height:20px;flex:none;color:#9aa0a6}
.bar input{font-size:17px;padding:0;height:100%}
.go{width:42px;height:42px;margin:0;border-radius:50%;font-size:18px}
.results{border-radius:0 0 22px 22px;border:0;box-shadow:0 6px 16px rgba(32,33,36,.18);top:calc(100% - 4px);padding:6px 0 10px}
.search:has(.results.open) .bar{border-radius:26px 26px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.r{padding:10px 22px}
.meta{justify-content:center;margin-top:14px}
.qrow{justify-content:center;gap:10px;margin-top:clamp(20px,4vh,32px);flex-wrap:wrap}
.qrow .btn{height:40px;padding:0 18px;font-size:12px;letter-spacing:.12em;border-radius:20px}
.learn{margin-top:clamp(18px,3.5vh,30px);font-size:14px;color:var(--low);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.learn button{color:var(--mid);font-size:14px}
.learn button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.learn i{font-style:normal;color:#c4c7c5}
footer{background:#f6f6f6;border-top:1px solid var(--line);color:var(--mid);font-size:13px;padding:14px var(--pad)}
footer .links{gap:22px}
@media (max-width:640px){
  header{height:58px}
  nav{gap:12px}
  nav a{font-size:13px}
  .inner{justify-content:flex-start}
  main{padding-top:clamp(40px,10vh,90px)}
  h1{font-size:clamp(26px,7.4vw,34px)}
  .bar{height:48px;padding-left:14px}
  .bar input{font-size:16px}
  .go{width:38px;height:38px}
  .qrow{flex-wrap:wrap;overflow:visible;margin:22px 0 0;padding:0}
  .qrow .btn{flex:0 0 auto;height:38px;padding:0 14px;font-size:11px}
  footer{flex-direction:column;align-items:center;text-align:center}
  footer .links{display:flex;justify-content:center;gap:14px;font-size:12px}
}

/* search results, search-engine style */
.results{max-height:min(560px,64vh)}
.rh{padding:10px 22px 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}
.r.rs{padding:9px 22px}
.r.rs .t{font-size:15px}
.r.rr{display:block;padding:11px 22px}
.r.rr .c{display:block;font-size:12px;color:var(--low);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.rr .t{display:block;font-size:17px;color:#1a0dab;white-space:normal;line-height:1.3}
html[lang=hi] .r.rr .t{font-size:16px}
.r.rr .s{display:block;font-size:14px;color:#4d5156;line-height:1.5;margin-top:2px}
.r.rr[aria-selected=true] .t{text-decoration:underline;text-underline-offset:3px}
.r+.r,.fa+.r{border-top:1px solid #f1f1f1}
.fa{margin:6px 14px 8px;padding:14px 16px;border:1px solid #dadce0;border-radius:12px;cursor:pointer}
.fa[aria-selected=true],.fa:hover{border-color:#111;background:#fafafa}
.fa-k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}
.fa-q{font-size:17px;margin:4px 0 6px;color:var(--ink)}
.fa-a{font-size:15px;color:#202124;margin:0 0 4px}
.fa-dots{list-style:none;color:var(--low)}
.fa ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#4d5156}
.fa li{margin:2px 0}
.fa-more{display:inline-block;margin-top:8px;font-size:13.5px;color:#1a0dab}
.results b{font-weight:600;color:inherit}
.sh-ul{margin:4px 0 14px 20px;padding:0;color:#333;font-size:16px;max-width:52ch}
.sh-ul li{margin:6px 0;line-height:1.5}
</style>
</head>

var FAQS=[
 {id:"f1",w:"what is rrt about rapid response team app network who join largest india",a:["android","ios","guide"],r:["f12","f2","f3"],
  en:{t:"What is RRT?",b:[["p","RRT is India's Largest Animal Welfare Rapid Response Team."],["ul",["A location-based network connecting people who care about animals.","Built for SOS-based, local, rapid response.","Anyone can join: animal lovers, feeders, rescuers, caregivers, volunteers and more.","Veterinarians and animal-care businesses will also be onboarded shortly."]],["p","You don't have to be a professional rescuer. If you care about animals and are willing to help when you can, you belong on RRT."]]},
  hi:{t:"RRT क्या है?",b:[["p","RRT भारत की सबसे बड़ी पशु कल्याण रैपिड रिस्पॉन्स टीम है।"],["ul",["जानवरों की परवाह करने वालों को जोड़ने वाला लोकेशन-आधारित नेटवर्क।","एसओएस पर आधारित, स्थानीय, तेज़ मदद के लिए बना।","कोई भी जुड़ सकता है: पशु प्रेमी, फीडर, रेस्क्यूअर, देखभाल करने वाले, वॉलंटियर और अन्य।","पशु चिकित्सक और पशु-देखभाल व्यवसाय भी जल्द ही जुड़ेंगे।"]],["p","आपको पेशेवर रेस्क्यूअर होने की ज़रूरत नहीं। अगर आप जानवरों की परवाह करते हैं और जब हो सके मदद के लिए तैयार हैं, तो RRT आपके लिए है।"]]}},
 {id:"f2",w:"whatsapp group different difference why better messages buried lost routing",a:["android","ios"],r:["f1","f6"],
  en:{t:"Why is RRT different from a WhatsApp group?",b:[["p","RRT is built specifically for animal welfare response."],["ul",["WhatsApp groups can have hundreds or thousands of members.","Important messages can quickly get buried or lost.","Everyone may receive messages that are irrelevant to where they are.","There is no automatic district-based routing.","It can be difficult to know who is actually nearby and able to help."]],["p","RRT is objective-focused: the right alert goes to the relevant local network."],["p","The goal: the right alert, to the right people, in the right place, when it matters."]]},
  hi:{t:"RRT व्हाट्सऐप ग्रुप से अलग कैसे है?",b:[["p","RRT खास तौर पर पशु कल्याण में मदद के लिए बना है।"],["ul",["व्हाट्सऐप ग्रुप में सैकड़ों या हज़ारों सदस्य हो सकते हैं।","ज़रूरी संदेश जल्दी दब जाते हैं या खो जाते हैं।","सबको ऐसे संदेश मिलते हैं जो उनकी जगह से जुड़े नहीं होते।","ज़िले के हिसाब से अपने-आप संदेश भेजने की व्यवस्था नहीं है।","यह जानना मुश्किल होता है कि सच में कौन पास है और मदद कर सकता है।"]],["p","RRT का मकसद साफ़ है: सही अलर्ट, संबंधित स्थानीय नेटवर्क तक।"],["p","लक्ष्य: सही अलर्ट, सही लोगों तक, सही जगह, सही समय पर।"]]}},
 {id:"f3",w:"directory members phone numbers privacy private contacts see browse visible",a:["android","ios"],r:["f8","f4"],
  en:{t:"Is RRT a directory of members and their phone numbers?",b:[["p","No. RRT is privacy first."],["ul",["Members cannot browse or see other members' phone numbers.","Your number is not visible simply because you joined RRT.","Your number becomes visible only when you raise an active SOS.","People in your district who receive that SOS will see your name, phone number and location.","They can use this information to coordinate help with you.","Responders cannot see each other's phone numbers either.","If a responder is free and able to help, they can contact the person who raised the SOS.","If they cannot help, they do not need to contact anyone.","When the SOS ends, your number immediately disappears from the active response context."]]]},
  hi:{t:"क्या RRT सदस्यों और उनके फ़ोन नंबरों की डायरेक्टरी है?",b:[["p","नहीं। RRT में निजता सबसे पहले है।"],["ul",["सदस्य दूसरे सदस्यों के फ़ोन नंबर नहीं देख सकते।","सिर्फ़ जुड़ने से आपका नंबर दिखाई नहीं देता।","आपका नंबर सिर्फ़ तब दिखता है जब आप सक्रिय एसओएस भेजते हैं।","आपके ज़िले में वह एसओएस पाने वाले लोग आपका नाम, फ़ोन नंबर और लोकेशन देखेंगे।","वे इस जानकारी से आपके साथ मदद का तालमेल कर सकते हैं।","मदद करने वाले एक-दूसरे का नंबर भी नहीं देख सकते।","अगर कोई खाली है और मदद कर सकता है, तो वह एसओएस भेजने वाले से संपर्क कर सकता है।","अगर वे मदद नहीं कर सकते, तो उन्हें किसी से संपर्क करने की ज़रूरत नहीं।","एसओएस खत्म होते ही आपका नंबर तुरंत सक्रिय मदद से हट जाता है।"]]]}},
 {id:"f4",w:"track tracking location continuously live gps follow surveillance privacy movements",a:["android","ios"],r:["f9","f7"],
  en:{t:"Does RRT continuously track my location?",b:[["p","No. Privacy is fundamental to RRT."],["ul",["RRT does not continuously track where you are.","Your live movements are not broadcast to other members.","Even during an active SOS, RRT does not continuously track your live location.","When you raise an SOS, your location at that time is shared with the relevant responders for coordination.","Once the SOS ends, that active response context ends."]],["p","RRT uses location for response, not surveillance."]]},
  hi:{t:"क्या RRT लगातार मेरी लोकेशन ट्रैक करता है?",b:[["p","नहीं। RRT में निजता बुनियादी है।"],["ul",["RRT लगातार यह ट्रैक नहीं करता कि आप कहाँ हैं।","आपकी लाइव आवाजाही दूसरे सदस्यों को नहीं दिखाई जाती।","सक्रिय एसओएस के दौरान भी RRT आपकी लाइव लोकेशन लगातार ट्रैक नहीं करता।","एसओएस भेजते समय की आपकी लोकेशन तालमेल के लिए संबंधित मदद करने वालों से साझा होती है।","एसओएस खत्म होते ही वह सक्रिय मदद भी खत्म हो जाती है।"]],["p","RRT लोकेशन का इस्तेमाल मदद के लिए करता है, निगरानी के लिए नहीं।"]]}},
 {id:"f5",w:"district assigned belong change city travel automatic which area move",a:["android","ios"],r:["f6","f7"],

  hi:{t:"RRT को कैसे पता चलता है कि मैं किस ज़िले में हूँ?",b:[["p","ऐप इस्तेमाल करते समय आप जहाँ हैं, उसी के आधार पर आपका ज़िला अपने-आप तय होता है।"],["p","उदाहरण के लिए:"],["ul",["आप बेंगलुरु में हैं और RRT खोलते हैं, तो आप संबंधित बेंगलुरु ज़िले में जुड़ जाते हैं।","कुछ दिन बाद आप मुंबई जाते हैं और RRT खोलते हैं, तो आप संबंधित मुंबई ज़िले में जुड़ जाते हैं।","आपको ज़िला खुद बदलने की ज़रूरत नहीं।"]]]}},
 {id:"f6",w:"sos alerts other districts receive notifications irrelevant another city routed",a:["android","ios"],r:["f5","f7"],
  en:{t:"Will I receive SOS alerts from other districts?",b:[["p","No."],["ul",["SOS alerts are routed to the relevant district.","If you are in Mumbai, you won't receive SOS alerts from Bengaluru.","This prevents irrelevant alerts and ensures the people receiving an alert are actually in a position to potentially help.","The network follows your current location without continuously tracking you."]]]},
  hi:{t:"क्या मुझे दूसरे ज़िलों के एसओएस अलर्ट मिलेंगे?",b:[["p","नहीं।"],["ul",["एसओएस अलर्ट संबंधित ज़िले तक ही भेजे जाते हैं।","अगर आप मुंबई में हैं, तो आपको बेंगलुरु के एसओएस अलर्ट नहीं मिलेंगे।","इससे बेकार अलर्ट नहीं आते और अलर्ट उन्हीं को मिलता है जो सच में मदद की स्थिति में हो सकते हैं।","नेटवर्क आपको लगातार ट्रैक किए बिना आपकी मौजूदा लोकेशन के साथ चलता है।"]]]}},
 {id:"f7",w:"why need location permission gps local help nearby access",a:["android","ios"],r:["f4","f9"],

function toksAll(s){return String(s).toLowerCase().replace(/[’']/g,"").split(/[^a-z0-9\u0900-\u097F]+/).filter(Boolean)}
function toks(s){
  return String(s).toLowerCase().replace(/[’']/g,"").split(/[^a-z0-9\u0900-\u097F]+/).filter(function(w){return w&&!STOP[w]});
}
function expand(w){
  var out=[stem(w)];(SYN[w]||SYN[stem(w)]||[]).forEach(function(x){out.push(stem(x))});return out;
}
function bag(s){var m={};toksAll(s).forEach(function(w){w=stem(w);m[w]=(m[w]||0)+1});return m}

var IDX=[];
function addDoc(d){
  d.T=bag(d.t+" "+(d.th||""));d.K=bag(d.w||"");d.B=bag(d.body||"");
  d.len=Object.keys(d.B).length+1;IDX.push(d);
}
function blocksText(x){
  var out=[];(x.b||[]).forEach(function(b){if(b[0]==="p")out.push(b[1]);else out=out.concat(b[1])});
  return out.concat(x.p||[]).concat((x.l||[]).map(function(i){return i[0]+". "+i[1]}));
}
Object.keys(S).forEach(function(id){
  var e=S[id].en,h=S[id].hi;
  addDoc({id:id,t:e.t,th:h.t,k:S[id].faq?"kFaq":"kInfo",u:"#s-"+id,w:S[id].w,
    sen:blocksText(e),shi:blocksText(h),body:blocksText(e).join(" ")+" "+blocksText(h).join(" ")+" "+(e.k||""),boost:S[id].faq?1.4:1.2});
});
PAGES.forEach(function(p){addDoc({t:p[0],th:p[1],k:p[2],u:p[3],w:p[4],sen:[],shi:[],body:"",boost:1})});
SECS.forEach(function(s){addDoc({t:"Laws: "+s[1],th:"कानून: "+s[2],k:"kLaw",u:"/know-the-laws#sec-"+s[0],w:s[3],sen:[],shi:[],body:"",boost:.9})});
LAWS.forEach(function(q){var s=SECS.filter(function(x){return x[0]===q[1]})[0];
  addDoc({t:q[2],th:q[2],k:"kLaw",u:"/know-the-laws#q"+q[0],w:s?s[3]:"",sen:[],shi:[],body:"",boost:.8})});

var DF={};IDX.forEach(function(d){var seen={};[d.T,d.K,d.B].forEach(function(m){Object.keys(m).forEach(function(w){seen[w]=1})});Object.keys(seen).forEach(function(w){DF[w]=(DF[w]||0)+1})});
var VOCAB=Object.keys(DF),N=IDX.length;
function idf(w){return Math.log(1+(N-(DF[w]||0)+.5)/((DF[w]||0)+.5))}

function field(m,w,prefix){
  if(m[w])return m[w];
  if(prefix&&w.length>=2){var n=0;for(var k in m){if(k.indexOf(w)===0)n+=m[k]}return n*.8}
  return 0;
}
function rank(v){
  var raw=toks(v);if(!raw.length)raw=toksAll(v);
  if(!raw.length)return [];
  var endsWord=/\s$/.test(v);
  var groups=raw.map(function(w,i){return {alts:expand(w),prefix:i===raw.length-1&&!endsWord}});
  var phrase=String(v).toLowerCase().trim();
  var scored=[];
  IDX.forEach(function(d){
    var s=0,covered=0;
    groups.forEach(function(g){
      var best=0;
      g.alts.forEach(function(w,ai){
        var wt=ai===0?1:.7,tf=3*field(d.T,w,g.prefix)+2*field(d.K,w,g.prefix)+field(d.B,w,g.prefix);
        if(tf>0){var x=wt*idf(w)*(tf*2.2)/(tf+1.2*(.25+.75*d.len/40));if(x>best)best=x}
      });
      if(best>0){covered++;s+=best}
    });
    if(!covered)return;
    var cov=covered/groups.length;
    s*=(.35+.65*cov*cov);
    var tl=(d.t+" "+(d.th||"")).toLowerCase().replace(/[?.!]/g,"").trim();
    if(tl.indexOf(phrase)>=0&&phrase.length>3)s*=1.6;
    if(d.t.toLowerCase().replace(/[?.!]/g,"")===phrase||(d.th||"")===phrase)s*=2.2;
    var inTitle=groups.every(function(g){return g.alts.some(function(w){return field(d.T,w,g.prefix)>0})});
    if(inTitle)s*=1.5;
    s*=d.boost;
    scored.push({d:d,s:s,cov:cov});
  });
  scored.sort(function(a,b){return b.s-a.s});
  return scored;
}
/* The sentence of a document that shares most words with the query. */
function snippet(d,v){
  var sens=(lang==="hi"&&d.shi&&d.shi.length)?d.shi:d.sen;
  if(!sens||!sens.length)return "";
  var qs={};toks(v).forEach(function(w){expand(w).forEach(function(x){qs[x]=1})});
  var best=sens[0],bs=-1;
  sens.forEach(function(sn){var sc=0;toks(sn).forEach(function(w){w=stem(w);for(var q in qs){if(w===q||(q.length>2&&w.indexOf(q)===0)){sc++;break}}});if(sc>bs){bs=sc;best=sn}});
  return best.length>170?best.slice(0,167)+"\u2026":best;
}
function hl(text,v){
  var out=esc(text);
  var ws={};toks(v).forEach(function(w){ws[w]=1;expand(w).forEach(function(x){if(x.length>2)ws[x]=1})});
  Object.keys(ws).filter(function(t){return t.length>1}).sort(function(a,b){return b.length-a.length}).forEach(function(t){
    out=out.replace(new RegExp("(^|[^\\w\u0900-\u097F>])("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[\\w\u0900-\u097F]*)","ig"),"$1<b>$2</b>")});
  return out;
}
function crumb(h){
  var d=T[lang];
  if(h.u.indexOf("#s-")===0)return "rapid-response.in \u203a "+(h.k==="kFaq"?d.kFaq:d.kInfo);
  if(/^https?:/.test(h.u))return h.u.replace(/^https?:\/\//,"").split("/")[0];
  if(h.u.indexOf("mailto:")===0)return d.kContact;
  return "rapid-response.in \u203a "+h.u.replace(/^\//,"").split(/[?#]/)[0].replace(/-/g," ");
}

var EXPLORE=["sos","ask","report","laws","shop"];
var PAA=["f1","f3","f4","f2","f10","f12"];
var q=$("q"),box=$("results"),hits=[],sel=0;
function render(){
  var v=q.value,d=T[lang],html="",vt=v.trim();
  if(!vt){
    hits=PAA.map(function(id){return {t:S[id].en.t,th:S[id].hi.t,k:"kFaq",u:"#s-"+id}})
      .concat(EXPLORE.map(function(id){return {t:S[id].en.c||S[id].en.t,th:S[id].hi.c||S[id].hi.t,k:"kInfo",u:"#s-"+id}}));
    html+='<div class="rh">'+esc(d.paa)+'</div>';
    hits.forEach(function(h,i){
      if(i===PAA.length)html+='<div class="rh">'+esc(d.explore)+'</div>';
      html+='<div class="r rs" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'"><span class="t">'+esc(lang==="hi"?h.th:h.t)+'</span><span class="k">'+esc(d[h.k])+'</span></div>';
    });
  }else{
    var ranked=rank(v),top=ranked[0];
    var seenT={};ranked=ranked.filter(function(x){var k=x.d.t.toLowerCase();if(seenT[k])return false;seenT[k]=1;return true});top=ranked[0];
    hits=ranked.slice(0,6).map(function(x){return x.d});
    var featured=top&&top.d.k==="kFaq"&&top.cov>=.5&&(!ranked[1]||top.s>=ranked[1].s*1.15);
    if(featured){
      var fd=S[top.d.id][lang],body="",done=false;
      fd.b.forEach(function(b){
        if(done)return;
        if(b[0]==="p")body+='<p class="fa-a">'+hl(b[1],v)+'</p>';
        else{body+='<ul>'+b[1].slice(0,3).map(function(x){return '<li>'+hl(x,v)+'</li>'}).join("")+(b[1].length>3?'<li class="fa-dots">\u2026</li>':'')+'</ul>';done=true}
      });
      html+='<div class="fa" role="option" id="r0" aria-selected="'+(sel===0)+'" data-i="0"><div class="fa-k">'+esc(d.answer)+'</div>'+
        '<div class="fa-q">'+esc(fd.t)+'</div>'+body+
        '<span class="fa-more">'+esc(d.readAll)+' \u2192</span></div>';
    }
    hits.forEach(function(h,i){
      if(featured&&i===0)return;
      var title=(lang==="hi"&&h.th)?h.th:h.t,sn=snippet(h,v);
      html+='<div class="r rr" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'">'+
        '<span class="c">'+esc(crumb(h))+'</span><span class="t">'+hl(title,v)+'</span>'+(sn?'<span class="s">'+hl(sn,v)+'</span>':'')+'</div>';
    });
    var extra=[{t:d.lawsFor+" \u201c"+vt+"\u201d",k:"kLaw",u:"/know-the-laws",x:1},
               {t:d.shopFor+" \u201c"+vt+"\u201d",k:"kPage",u:"/shop?q="+encodeURIComponent(vt),x:1}];
    if(!hits.length)html+='<div class="rh">'+esc(d.noHits)+' \u201c'+esc(vt)+'\u201d</div>';
    extra.forEach(function(h){var i=hits.length;hits.push(h);
      html+='<div class="r rs" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'"><span class="t">'+esc(h.t)+'</span><span class="k">'+esc(d[h.k])+'</span></div>'});
  }
  sel=Math.max(0,Math.min(sel,hits.length-1));
  box.innerHTML=html;
  mark();
  box.classList.add("open");q.setAttribute("aria-expanded","true");
}

function hide(){box.classList.remove("open");q.setAttribute("aria-expanded","false")}
function mark(){
  box.querySelectorAll("[data-i]").forEach(function(r){r.setAttribute("aria-selected",+r.dataset.i===sel)});
  q.setAttribute("aria-activedescendant","r"+sel);
  var el=$("r"+sel);if(el)el.scrollIntoView({block:"nearest"});
}
function open(i){
  var h=hits[i];if(!h)return;
  remember(q.value.trim());drawRecent();
  hide();
  if(h.u.indexOf("#s-")===0){q.blur();openSheet(h.u.slice(3))}else location.href=h.u;
}
q.addEventListener("input",function(){sel=0;render()});
q.addEventListener("focus",function(){sel=0;render()});
q.addEventListener("keydown",function(e){
  if(e.key==="ArrowDown"){e.preventDefault();if(!box.classList.contains("open"))render();sel=(sel+1)%hits.length;mark()}
  else if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+hits.length)%hits.length;mark()}
  else if(e.key==="Enter"){e.preventDefault();if(!box.classList.contains("open"))render();open(sel)}
  else if(e.key==="Tab"&&!e.shiftKey&&q.value.trim()&&hits[sel]&&!hits[sel].x){
    e.preventDefault();var h=hits[sel];q.value=(lang==="hi"&&h.th)?h.th:h.t;render()}
  else if(e.key==="Escape"){if(q.value){q.value="";render()}else{hide();q.blur()}}
});
box.addEventListener("mousedown",function(e){var r=e.target.closest("[data-i]");if(r){e.preventDefault();open(+r.dataset.i)}});
document.addEventListener("click",function(e){if(!e.target.closest(".search"))hide()});
$("go").onclick=function(){
  if(box.classList.contains("open")&&hits.length){open(sel)}
  else{q.focus()}
};
document.addEventListener("keydown",function(e){
  if(cur)return;
  var a=document.activeElement;
  if(e.key==="/"&&a!==q&&!/input|textarea/i.test(a.tagName)){e.preventDefault();q.focus()}
});

/* ------------------------------------------------------ recent searches */
function getRecent(){try{return JSON.parse(store.get("rr-recent")||"[]")}catch(e){return []}}
function remember(v){
  if(!v)return;var r=getRecent().filter(function(x){return x.toLowerCase()!==v.toLowerCase()});
  r.unshift(v);store.set("rr-recent",JSON.stringify(r.slice(0,4)));
}
function drawRecent(){
  var r=getRecent();$("recentRow").hidden=!r.length;
  $("recent").innerHTML=r.map(function(x,i){return '<button class="chip'+(i===0?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join("");
}
$("recent").addEventListener("click",function(e){var b=e.target.closest("button");if(b){q.value=b.dataset.v;sel=0;q.focus();render()}});
$("clear").onclick=function(){store.set("rr-recent","[]");drawRecent();q.focus()};

applyLang(lang);
drawRecent();
fromHash();
})();

</script>
