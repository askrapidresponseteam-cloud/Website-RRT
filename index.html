<style>
/* Rapid Response homepage. The header is the site's shared header
   (assets/rr-site.css) so the logo sits exactly where it does on every
   other page; this sheet styles only what is below it. */
:root{
  --ink:#111;--mid:#5f6368;--low:#80868b;--line:#e3e3e3;--red:#e52222;
  --serif:"Marcellus","Trajan Pro","Optima",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans Devanagari",system-ui,sans-serif;
  --pad:clamp(18px,7vw,120px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{font-synthesis:none}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=hi] body{font-family:"Noto Sans Devanagari",var(--sans)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* one centred column */
main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,3vh,40px) var(--pad)}
.inner{width:100%;max-width:720px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,min(3.7vw,6vh),46px);line-height:1.15}
html[lang=hi] h1{font-family:"Noto Sans Devanagari",var(--serif);font-weight:500}

/* search */
.search{position:relative;width:100%;margin-top:clamp(22px,4.5vh,40px);text-align:left}
.bar{display:flex;align-items:center;gap:10px;height:54px;padding:0 6px 0 18px;border:1px solid #dfe1e5;border-radius:28px;background:#fff;transition:box-shadow .15s,border-color .15s}
.bar:hover,.bar:focus-within,.bar.listening{box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.search:has(.results.open) .bar{border-radius:26px 26px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.sico{flex:none;width:20px;height:20px;color:#9aa0a6}
.bar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--ink)}
.bar input::placeholder{color:#9aa0a6}
.mic{flex:none;width:40px;height:40px;margin-right:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mid)}
.mic svg{width:22px;height:22px}
.mic:hover{background:#f1f3f4;color:var(--ink)}
.mic.on{color:#fff;background:var(--red);animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(229,34,34,.45)}70%{box-shadow:0 0 0 12px rgba(229,34,34,0)}100%{box-shadow:0 0 0 0 rgba(229,34,34,0)}}
.go{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.go:hover{background:#333}
.go svg{display:block}
.vmsg{margin-top:10px;font-size:13.5px;color:var(--mid);text-align:center}
.vmsg.err{color:var(--red)}

/* results */
.results{position:absolute;left:0;right:0;top:calc(100% - 4px);z-index:20;display:none;max-height:min(560px,64vh);overflow:auto;
  padding:6px 0 10px;background:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 16px rgba(32,33,36,.18)}
.results.open{display:block}
.results b{font-weight:600;color:inherit}
.rh{padding:10px 22px 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}
.r{display:flex;align-items:baseline;gap:14px;padding:9px 22px;cursor:pointer}
.r+.r,.fa+.r{border-top:1px solid #f1f1f1}
.r[aria-selected=true],.r:hover{background:#f6f6f6}
.r .t{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .k{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}
.r.rr{display:block;padding:11px 22px}
.r.rr .c{display:block;margin-bottom:1px;font-size:12px;color:var(--low);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.rr .t{display:block;font-size:17px;line-height:1.3;color:#1a0dab;white-space:normal}
html[lang=hi] .r.rr .t{font-size:16px}
.r.rr .s{display:block;margin-top:2px;font-size:14px;line-height:1.5;color:#4d5156}
.r.rr[aria-selected=true] .t{text-decoration:underline;text-underline-offset:3px}
.fa{margin:6px 14px 8px;padding:14px 16px;border:1px solid #dadce0;border-radius:12px;cursor:pointer}
.fa[aria-selected=true],.fa:hover{border-color:var(--ink);background:#fafafa}
.fa.pin{border-color:var(--ink)}
.fa-k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}
.fa.pin .fa-k{color:var(--red)}
.fa-q{margin:4px 0 6px;font-size:17px;color:var(--ink)}
.fa-a{margin:0 0 4px;font-size:15px;color:#202124}
.fa ul{margin:6px 0 0 18px;font-size:14px;color:#4d5156}
.fa li{margin:2px 0}
.fa-dots{list-style:none;color:var(--low)}
.fa-more{display:inline-block;margin-top:8px;font-size:13.5px;color:#1a0dab}

/* recent searches */
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mid)}
.chip{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:17px;font-size:14px;color:var(--mid)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip:hover{border-color:var(--ink)}

/* actions */
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border:1px solid var(--ink);border-radius:20px;
  background:#fff;color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:#f4f4f4}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#333}
html[lang=hi] .btn{letter-spacing:0;font-size:14px;font-weight:500}
.qrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:clamp(20px,4vh,32px)}
.learn{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;margin-top:clamp(18px,3.5vh,30px);font-size:14px;color:var(--low)}
.learn button{font-size:14px;color:var(--mid)}
.learn button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.learn i{font-style:normal;color:#9aa0a6}

/* footer */
footer{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding:14px var(--pad);
  background:#f6f6f6;border-top:1px solid var(--line);font-size:13px;color:var(--mid)}
footer .links{display:flex;flex-wrap:wrap;gap:22px}
footer a:hover{color:var(--ink)}

/* info sheet */
.scrim{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:951;width:min(560px,100%);display:flex;flex-direction:column;background:#fff;
  border-left:1px solid var(--ink);transform:translateX(100%);transition:transform .25s ease;outline:none}
.sheet.open{transform:none}
.sh-top{flex:none;display:flex;justify-content:space-between;align-items:center;height:64px;padding:env(safe-area-inset-top,0px) 28px 0;border-bottom:1px solid var(--line);box-sizing:content-box}
.sh-k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.sh-x{width:36px;height:36px;font-size:24px}
.sh-body{flex:1;overflow:auto;padding:28px 28px 20px}
.sh-body h2{margin-bottom:16px;font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.1;text-transform:uppercase}
html[lang=hi] .sh-body h2{font-family:"Noto Sans Devanagari",var(--serif);font-weight:500;text-transform:none}
.sh-body p{max-width:52ch;margin-bottom:12px;font-size:16px;color:#333}
.sh-body p.em{font-weight:600;color:var(--ink)}
.sh-body .sh-lt{margin:22px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sh-ul{max-width:52ch;margin:4px 0 14px 20px;font-size:16px;color:#333}
.sh-ul li{margin:6px 0;line-height:1.5}
.sh-list a,.sh-list div{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.sh-list b{display:block;font-weight:500;font-size:16px}
.sh-list span{display:block;font-size:14.5px;color:var(--mid)}
.sh-list a:hover b{text-decoration:underline;text-underline-offset:4px}
.sh-rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sh-rel .chip{display:inline-flex;align-items:center;text-align:left}
.sh-rel .chip[aria-current=true]{border-color:var(--ink);color:var(--ink)}
.sh-qa{margin-top:26px;border-top:1px solid var(--line)}
.sh-q{position:relative;padding:22px 0 10px;border-bottom:1px solid var(--line);border-radius:4px}
.sh-q h3{margin-bottom:10px;font-size:18px;font-weight:600;line-height:1.35;color:var(--ink);outline:none}
.sh-q h3:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.sh-q.hl{animation:qhl 2.4s ease-out}
@keyframes qhl{0%,35%{background:#fff3c4;box-shadow:-12px 0 0 #fff3c4,12px 0 0 #fff3c4}100%{background:transparent;box-shadow:-12px 0 0 transparent,12px 0 0 transparent}}
.sh-back{margin:4px 0 6px;font-size:13px;color:var(--mid)}
.sh-back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sh-act{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:16px 28px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
body.lock{overflow:hidden}

@media (max-width:640px){
  body{font-size:14px}
  main{justify-content:flex-start;padding:clamp(40px,10vh,90px) 18px 14px}
  .inner{justify-content:flex-start}
  h1{font-size:clamp(26px,7.4vw,34px)}
  .bar{height:48px;padding-left:14px}
  .bar input{font-size:16px}
  .go{width:38px;height:38px}
  .qrow{margin-top:22px}
  .qrow .btn{height:38px;padding:0 14px;font-size:11px}
  footer{flex-direction:column;align-items:center;text-align:center;padding:10px 18px}
  footer .links{justify-content:center;gap:14px;font-size:12px}
  .sheet{top:auto;height:88dvh;width:100%;border-left:0;border-top:1px solid var(--ink);transform:translateY(100%)}
  .sh-top{height:56px;padding:0 20px}
  .sh-body{padding:22px 20px 16px}
  .sh-act{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
  .sh-act .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.sheet,.scrim{transition:none}.sh-q.hl{animation:none;background:#fff3c4}}
</style>

</head>

<main>
 <div class="inner">
  <h1 data-i="h1">How can we help an animal today?</h1>

  <div class="search" role="search">
    <div class="bar">
      <svg class="sico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search Rapid Response">
      <button class="mic" id="mic" type="button" aria-label="Search by voice" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="go" id="go" aria-label="Search"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 12h15M13.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="results" id="results" role="listbox"></div>
  </div>
  <p class="vmsg" id="vmsg" role="status" aria-live="polite" hidden></p>

  <div class="meta" id="recentRow" hidden>
    <span data-i="recent">Recent</span>
    <span id="recent" style="display:contents"></span>
    <button class="chip" id="clear" data-i="clear">Clear</button>

 {id:"f1",w:"what is rrt about rapid response team app network who join largest india",a:["android","ios","guide"],r:["f12","f2","f3"],
  en:{t:"What is RRT?",b:[["p","RRT is India's Largest Animal Welfare Rapid Response Team."],["ul",["A location-based network connecting people who care about animals.","Built for SOS-based, local, rapid response.","Anyone can join: animal lovers, feeders, rescuers, caregivers, volunteers and more.","Veterinarians and animal-care businesses will also be onboarded shortly."]],["p","You don't have to be a professional rescuer. If you care about animals and are willing to help when you can, you belong on RRT."]]},
  hi:{t:"RRT क्या है?",b:[["p","RRT भारत की सबसे बड़ी पशु कल्याण रैपिड रिस्पॉन्स टीम है।"],["ul",["जानवरों की परवाह करने वालों को जोड़ने वाला लोकेशन-आधारित नेटवर्क।","एसओएस पर आधारित, स्थानीय, तेज़ मदद के लिए बना।","कोई भी जुड़ सकता है: पशु प्रेमी, फीडर, रेस्क्यूअर, देखभाल करने वाले, वॉलंटियर और अन्य।","पशु चिकित्सक और पशु-देखभाल व्यवसाय भी जल्द ही जुड़ेंगे।"]],["p","आपको पेशेवर रेस्क्यूअर होने की ज़रूरत नहीं। अगर आप जानवरों की परवाह करते हैं और जब हो सके मदद के लिए तैयार हैं, तो RRT आपके लिए है।"]]}},
 {id:"f2",w:"whatsapp group different difference why better messages buried lost routing",a:["android","ios"],r:["f1","f6"],
  en:{t:"Why is RRT different from a WhatsApp group?",b:[["p","RRT is built specifically for animal welfare response."],["ul",["WhatsApp groups can have hundreds or thousands of members.","Important messages can quickly get buried or lost.","Everyone may receive messages that are irrelevant to where they are.","There is no automatic district-based routing.","It can be difficult to know who is actually nearby and able to help."]],["p","RRT is objective-focused: the right alert goes to the relevant local network."],["p","The goal: the right alert, to the right people, in the right place, when it matters."]]},
  hi:{t:"RRT व्हाट्सऐप ग्रुप से अलग कैसे है?",b:[["p","RRT खास तौर पर पशु कल्याण में मदद के लिए बना है।"],["ul",["व्हाट्सऐप ग्रुप में सैकड़ों या हज़ारों सदस्य हो सकते हैं।","ज़रूरी संदेश जल्दी दब जाते हैं या खो जाते हैं।","सबको ऐसे संदेश मिलते हैं जो उनकी जगह से जुड़े नहीं होते।","ज़िले के हिसाब से अपने-आप संदेश भेजने की व्यवस्था नहीं है।","यह जानना मुश्किल होता है कि सच में कौन पास है और मदद कर सकता है।"]],["p","RRT का मकसद साफ़ है: सही अलर्ट, संबंधित स्थानीय नेटवर्क तक।"],["p","लक्ष्य: सही अलर्ट, सही लोगों तक, सही जगह, सही समय पर।"]]}},
 {id:"f3",w:"directory members phone numbers privacy private contacts see browse visible",a:["android","ios"],r:["f8","f4"],
  en:{t:"Is RRT a directory of members and their phone numbers?",b:[["p","No. RRT is privacy first."],["ul",["Members cannot browse or see other members' phone numbers.","Your number is not visible simply because you joined RRT.","Your number becomes visible only when you raise an active SOS.","People in your district who receive that SOS will see your name, phone number and location.","They can use this information to coordinate help with you.","Responders cannot see each other's phone numbers either.","If a responder is free and able to help, they can contact the person who raised the SOS.","If they cannot help, they do not need to contact anyone.","When the SOS ends, your number immediately disappears from the active response context."]]]},
  hi:{t:"क्या RRT सदस्यों और उनके फ़ोन नंबरों की डायरेक्टरी है?",b:[["p","नहीं। RRT में निजता सबसे पहले है।"],["ul",["सदस्य दूसरे सदस्यों के फ़ोन नंबर नहीं देख सकते।","सिर्फ़ जुड़ने से आपका नंबर दिखाई नहीं देता।","आपका नंबर सिर्फ़ तब दिखता है जब आप सक्रिय एसओएस भेजते हैं।","आपके ज़िले में वह एसओएस पाने वाले लोग आपका नाम, फ़ोन नंबर और लोकेशन देखेंगे।","वे इस जानकारी से आपके साथ मदद का तालमेल कर सकते हैं।","मदद करने वाले एक-दूसरे का नंबर भी नहीं देख सकते।","अगर कोई खाली है और मदद कर सकता है, तो वह एसओएस भेजने वाले से संपर्क कर सकता है।","अगर वे मदद नहीं कर सकते, तो उन्हें किसी से संपर्क करने की ज़रूरत नहीं।","एसओएस खत्म होते ही आपका नंबर तुरंत सक्रिय मदद से हट जाता है।"]]]}},
 {id:"f4",w:"track tracking location continuously live gps follow surveillance privacy movements",a:["android","ios"],r:["f9","f7"],
  en:{t:"Does RRT continuously track my location?",b:[["p","No. Privacy is fundamental to RRT."],["ul",["RRT does not continuously track where you are.","Your live movements are not broadcast to other members.","Even during an active SOS, RRT does not continuously track your live location.","When you raise an SOS, your location at that time is shared with the relevant responders for coordination.","Once the SOS ends, that active response context ends."]],["p","RRT uses location for response, not surveillance."]]},
  hi:{t:"क्या RRT लगातार मेरी लोकेशन ट्रैक करता है?",b:[["p","नहीं। RRT में निजता बुनियादी है।"],["ul",["RRT लगातार यह ट्रैक नहीं करता कि आप कहाँ हैं।","आपकी लाइव आवाजाही दूसरे सदस्यों को नहीं दिखाई जाती।","सक्रिय एसओएस के दौरान भी RRT आपकी लाइव लोकेशन लगातार ट्रैक नहीं करता।","एसओएस भेजते समय की आपकी लोकेशन तालमेल के लिए संबंधित मदद करने वालों से साझा होती है।","एसओएस खत्म होते ही वह सक्रिय मदद भी खत्म हो जाती है।"]],["p","RRT लोकेशन का इस्तेमाल मदद के लिए करता है, निगरानी के लिए नहीं।"]]}},

 {id:"f6",w:"sos alerts other districts receive notifications irrelevant another city routed",a:["android","ios"],r:["f5","f7"],
  en:{t:"Will I receive SOS alerts from other districts?",b:[["p","No."],["ul",["SOS alerts are routed to the relevant district.","If you are in Mumbai, you won't receive SOS alerts from Bengaluru.","This prevents irrelevant alerts and ensures the people receiving an alert are actually in a position to potentially help.","The network follows your current location without continuously tracking you."]]]},
  hi:{t:"क्या मुझे दूसरे ज़िलों के एसओएस अलर्ट मिलेंगे?",b:[["p","नहीं।"],["ul",["एसओएस अलर्ट संबंधित ज़िले तक ही भेजे जाते हैं।","अगर आप मुंबई में हैं, तो आपको बेंगलुरु के एसओएस अलर्ट नहीं मिलेंगे।","इससे बेकार अलर्ट नहीं आते और अलर्ट उन्हीं को मिलता है जो सच में मदद की स्थिति में हो सकते हैं।","नेटवर्क आपको लगातार ट्रैक किए बिना आपकी मौजूदा लोकेशन के साथ चलता है।"]]]}},
 {id:"f7",w:"why need location permission gps local help nearby access",a:["android","ios"],r:["f4","f9"],

  hi:{t:"RRT को मेरी लोकेशन क्यों चाहिए?",b:[["p","क्योंकि पशु आपात स्थिति में स्थानीय मदद चाहिए।"],["ul",["कुछ किलोमीटर दूर का व्यक्ति जानवर तक जल्दी पहुँच सकता है।","सैकड़ों किलोमीटर दूर का व्यक्ति नहीं पहुँच सकता।","RRT एसओएस को अपने-आप संबंधित स्थानीय नेटवर्क तक भेजता है।","इससे अलर्ट प्रासंगिक, उपयोगी और केंद्रित रहते हैं।"]]]}},
 {id:"f8",w:"phone number visible when shown see mobile contact exactly privacy",a:["android","ios"],r:["f3","f9"],

 {id:"f9",w:"share live location responders broadcast update movements sos",a:["android","ios"],r:["f4","f8"],

function rank(v){

function crumb(h){
  var d=T[lang];
  if(h.u.indexOf("#s-")===0)return "rapid-response.in \u203a "+(h.k==="kFaq"?d.kFaq:d.kInfo);
  if(/^https?:/.test(h.u))return h.u.replace(/^https?:\/\//,"").split("/")[0];
  if(h.u.indexOf("mailto:")===0)return d.kContact;
  return "rapid-response.in \u203a "+h.u.replace(/^\//,"").split(/[?#]/)[0].replace(/-/g," ");
}

/* ------------------------------------------------ query understanding
   Deterministic, no model: strip spoken filler, correct place names and
   misspellings against a fixed dictionary, then recognise the handful of
   things people come here to do. The same words always give the same
   result, so every case below is testable. */
var PLACES={
 "Udupi":["udupi","udapi","udipi","udupee","udupi district"],"Kundapura":["kundapura","kundapur","kundapoor"],
 "Manipal":["manipal","manipaal"],"Karkala":["karkala","karkal"],"Mangaluru":["mangaluru","mangalore","mangalor","manglore","kudla"],
 "Bengaluru":["bengaluru","bangalore","banglore","bengalore","blr"],"Mysuru":["mysuru","mysore","maisur"],
 "Hubballi":["hubballi","hubli"],"Dharwad":["dharwad","dharwar"],"Belagavi":["belagavi","belgaum"],"Kalaburagi":["kalaburagi","gulbarga"],
 "Shivamogga":["shivamogga","shimoga"],"Davanagere":["davanagere","davangere"],"Ballari":["ballari","bellary"],"Tumakuru":["tumakuru","tumkur"],
 "Hassan":["hassan"],"Chikkamagaluru":["chikkamagaluru","chikmagalur"],"Kodagu":["kodagu","coorg","madikeri"],"Karwar":["karwar","uttara kannada"],
 "Mumbai":["mumbai","bombay"],"Pune":["pune","poona"],"Delhi":["delhi","new delhi","dilli"],"Gurugram":["gurugram","gurgaon"],"Noida":["noida"],
 "Chennai":["chennai","madras"],"Hyderabad":["hyderabad","hydrabad"],"Kolkata":["kolkata","calcutta"],"Ahmedabad":["ahmedabad","amdavad"],
 "Jaipur":["jaipur"],"Lucknow":["lucknow"],"Kochi":["kochi","cochin"],"Thiruvananthapuram":["thiruvananthapuram","trivandrum"],
 "Goa":["goa","panaji","panjim"],"Chandigarh":["chandigarh"],"Indore":["indore"],"Bhopal":["bhopal"],"Nagpur":["nagpur"],"Patna":["patna"],
 "Coimbatore":["coimbatore","kovai"],"Visakhapatnam":["visakhapatnam","vizag"],"Bhubaneswar":["bhubaneswar"],"Guwahati":["guwahati"],
 "Dehradun":["dehradun"],"Surat":["surat"],"Vadodara":["vadodara","baroda"],"Nashik":["nashik","nasik"],"Varanasi":["varanasi","banaras"]
};
var PLACE_ALIAS={};Object.keys(PLACES).forEach(function(k){PLACES[k].forEach(function(a){PLACE_ALIAS[a]=k})});

function lev(a,b){ // Damerau-Levenshtein (adjacent transpositions)
  var m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;
  var d=[];for(var i=0;i<=m;i++){d[i]=[i];}for(var j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    var c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function tol(w){return w.length>=8?2:(w.length>=4?1:0)}

var FILLER=/^(?:(?:please|pls|hey|hi|ok|okay|so|um+|uh+)\s+)*(?:(?:can|could|would) you\s+|i (?:want|need|would like) to\s+|i wanna\s+|help me(?: to)?\s+|let me\s+)?(?:(?:please)\s+)?(?:show(?: me)?|tell(?: me)?(?: about)?|find(?: me)?|search(?: for)?|look(?:ing)? for|get(?: me)?|give(?: me)?|open|list|where (?:is|are|can i find))\s+/;

function understand(raw){
  var v=String(raw||"").toLowerCase().replace(/[\u2019']/g,"").replace(/[?!.,]+/g," ").replace(/\s+/g," ").trim();
  var out={text:v,place:null,near:false,intent:null};
  if(!v)return out;
  v=v.replace(FILLER,"");
  if(/\b(?:near me|nearby|around me|close to me|my area|my location|near my (?:home|house|place))\b/.test(v)){out.near=true;v=v.replace(/\b(?:near me|nearby|around me|close to me|my area|my location|near my (?:home|house|place))\b/g," ")}
  // places: longest alias first, exact then fuzzy on single words
  var words=v.split(" ");
  for(var n=3;n>=1&&!out.place;n--){
    for(var i=0;i+n<=words.length;i++){
      var g=words.slice(i,i+n).join(" ");
      if(PLACE_ALIAS[g]){out.place=PLACE_ALIAS[g];words.splice(i,n);break}
    }
  }
  if(!out.place){
    for(i=0;i<words.length;i++){
      var w=words[i];if(w.length<5||DF[stem(w)])continue;
      var best=null,bd=9;
      for(var a in PLACE_ALIAS){if(a.indexOf(" ")>=0)continue;var dd=lev(w,a);if(dd<bd){bd=dd;best=a}}
      if(best&&bd<=tol(w)){out.place=PLACE_ALIAS[best];words.splice(i,1);break}
    }
  }
  v=words.join(" ").replace(/\b(?:near|nearby|around|in|at|close to|next to)\s*$/,"").replace(/\s+/g," ").trim();
  out.text=v;
  var has=function(re){return re.test(v)};
  if(has(/\b(?:raise|send|start|trigger|make)\s+(?:an?\s+)?(?:sos|alert|emergency)\b|^(?:sos|emergency)$|\b(?:injured|bleeding|hit by|accident|attacked|dying)\b/))out.intent="sos";
  else if(has(/\bask (?:the |my )?district\b/))out.intent="ask";
  else if(has(/\b(?:cases?|incidents?|complaints?|records?|reports)\b/)&&!has(/\bhow\b/))out.intent="cases";
  else if(has(/\breport(?:ing)?\b|\bcruelty\b|\babuse\b/))out.intent="report";
  else if(has(/\b(?:vets?|veterinar\w*|animal doctors?|doctors?|clinics?|animal hospitals?|hospitals?)\b/)&&!has(/\b(?:join|register|apply|verified)\b/))out.intent="vet";
  else if(has(/\b(?:shelters?|rescuers?|rescue (?:team|group|centre|center)s?|fosters?|ngos?|volunteers? near|animal homes?)\b/))out.intent="helpers";
  else if(has(/\b(?:buy|order|shop|shopping)\b|\b(?:dog|cat|puppy|kitten|pet) (?:food|treats?|shampoo|medicine|toys?)\b|\b(?:collar|leash|harness|dewormer|deworming|tick|flea)\b/))out.intent="shop";
  return out;
}

/* One pinned "do this" result per recognised intent. Honest about what the
   website itself can and cannot do: vet and helper searches live in the
   app, so the card says so and opens the answer that explains how. */
function pinFor(u,raw){
  var hi=lang==="hi",P=u.place,where=P?(hi?P+" में":"in "+P):(u.near?(hi?"आपके पास":"near you"):"");
  switch(u.intent){
    case "sos":return {t:hi?"एसओएस भेजें":"Raise an SOS",s:hi?"अभी मदद चाहिए? ऐप में एसओएस दबाएँ, आपके ज़िले के सबसे नज़दीकी लोगों तक तुरंत पहुँचता है।":"Help needed now? Tap SOS in the app. It reaches the nearest people in your district at once.",u:"#s-sos"};
    case "ask":return {t:hi?"जिले से पूछें":"Ask the District",s:S.ask[lang].p[0],u:"#s-ask"};
    case "vet":return {t:(hi?"वेट खोजें ":"Find a vet ")+where,s:hi?"RRT ऐप में लोकेशन-आधारित वेट खोज 5 किमी से शुरू होकर 25 किमी तक जाती है।":"The RRT app's vet search starts within 5 km of you and widens up to 25 km.",u:"#s-f10"};
    case "helpers":return {t:(hi?"शेल्टर, रेस्क्यूअर और फोस्टर ":"Shelters, rescuers and fosters ")+where,s:hi?"ऐप में 'जिले से पूछें' पर पोस्ट करें: आपके ज़िले के फीडर, फोस्टर, वेट और रेस्क्यूअर जवाब देते हैं। किसी का नंबर सार्वजनिक नहीं होता।":"Post on Ask the District in the app: feeders, fosters, vets and rescuers in your district answer. Nobody's number is public.",u:"#s-ask"};
    case "cases":return P?{t:(hi?"ऑन रिकॉर्ड: ":"On Record: cases ")+where,s:hi?"सार्वजनिक रजिस्टर में इस जगह के दर्ज मामले खोलें।":"Open the public register filtered to this place.",u:"/report?q="+encodeURIComponent(P)+"#feed"}
                          :{t:hi?"ऑन रिकॉर्ड: दर्ज मामले":"On Record: documented cases",s:hi?"पूरे भारत के दर्ज पशु क्रूरता मामलों का सार्वजनिक रजिस्टर।":"The public register of documented animal cruelty across India.",u:"/report"};
    case "report":return {t:hi?"घटना रिपोर्ट करें":"Report an incident",s:S.report[lang].p[0],u:"/report?new=1"};
    case "shop":var term=u.text.replace(/\b(?:buy|order|shop|shopping|for|some|a|an|the|from rrt|online)\b/g," ").replace(/\s+/g," ").trim();
      return {t:term?(hi?"शॉप में खोजें: ":"Shop: ")+term:(hi?"आरआरटी शॉप":"The RRT Shop"),s:hi?"पार्टनर स्टोर की लाइव कीमतें, पूरे भारत में डिलीवरी।":"Live prices from the partner store, delivered across India.",u:term?"/shop?q="+encodeURIComponent(term):"/shop"};
  }
  return null;
}

/* Spelling: a query word the index has never seen is swapped for the
   closest word it has (edit distance 1, or 2 for long words). */
function correct(text){
  return text.split(" ").map(function(w){
    if(!w||/[\u0900-\u097F]/.test(w)||STOP[w]||DF[stem(w)]||SYN[w]||w.length<4)return w;
    var best=null,bd=9,t=tol(w);
    for(var k=0;k<VOCAB.length;k++){var c=VOCAB[k];if(Math.abs(c.length-w.length)>t)continue;var dd=lev(w,c);if(dd<bd||(dd===bd&&DF[c]>DF[best])){bd=dd;best=c}}
    return best&&bd<=t?best:w;
  }).join(" ");
}

var EXPLORE=["sos","ask","report","laws","shop"];
var PAA=["f1","f3","f4","f2","f10","f12"];
var q=$("q"),box=$("results"),hits=[],sel=0;
function render(){
  var v=q.value,d=T[lang],html="",vt=v.trim();
  if(!vt){
    hits=PAA.map(function(id){return {t:S[id].en.t,th:S[id].hi.t,k:"kFaq",u:"#s-"+id}})
      .concat(EXPLORE.map(function(id){return {t:S[id].en.c||S[id].en.t,th:S[id].hi.c||S[id].hi.t,k:"kInfo",u:"#s-"+id}}));
    html+='<div class="rh">'+esc(d.paa)+'</div>';
    hits.forEach(function(h,i){
      if(i===PAA.length)html+='<div class="rh">'+esc(d.explore)+'</div>';
      html+='<div class="r rs" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'"><span class="t">'+esc(lang==="hi"?h.th:h.t)+'</span><span class="k">'+esc(d[h.k])+'</span></div>';
    });
  }else{
    var U=understand(v),qtext=correct(U.text||vt),pin=pinFor(U,v);
    var ranked=rank((qtext||vt)+(/\s$/.test(v)?" ":"")),top=ranked[0];
    var hv=qtext+" "+(U.place||"");
    var seenT={};ranked=ranked.filter(function(x){var k=x.d.t.toLowerCase();if(seenT[k])return false;seenT[k]=1;return true});top=ranked[0];
    hits=ranked.slice(0,6).map(function(x){return x.d});
    var featured=!pin&&top&&top.d.k==="kFaq"&&top.cov>=.5&&(!ranked[1]||top.s>=ranked[1].s*1.15);
    if(pin){
      hits.unshift({t:pin.t,th:pin.t,k:"kAction",u:pin.u,pin:1});
      html+='<div class="fa pin" role="option" id="r0" aria-selected="'+(sel===0)+'" data-i="0"><div class="fa-k">'+esc(d.kAction)+'</div>'+
        '<div class="fa-q">'+esc(pin.t)+'</div><p class="fa-a">'+esc(pin.s)+'</p><span class="fa-more">'+esc(d.goNow)+' \u2192</span></div>';
    }
    if(featured){
      var fd=S[top.d.id][lang],body="",done=false;
      fd.b.forEach(function(b){
        if(done)return;
        if(b[0]==="p")body+='<p class="fa-a">'+hl(b[1],hv)+'</p>';
        else{body+='<ul>'+b[1].slice(0,3).map(function(x){return '<li>'+hl(x,hv)+'</li>'}).join("")+(b[1].length>3?'<li class="fa-dots">\u2026</li>':'')+'</ul>';done=true}
      });
      html+='<div class="fa" role="option" id="r0" aria-selected="'+(sel===0)+'" data-i="0"><div class="fa-k">'+esc(d.answer)+'</div>'+
        '<div class="fa-q">'+esc(fd.t)+'</div>'+body+
        '<span class="fa-more">'+esc(d.readAll)+' \u2192</span></div>';
    }
    hits.forEach(function(h,i){
      if((featured||pin)&&i===0)return;
      var title=(lang==="hi"&&h.th)?h.th:h.t,sn=snippet(h,hv);
      html+='<div class="r rr" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'">'+
        '<span class="c">'+esc(crumb(h))+'</span><span class="t">'+hl(title,hv)+'</span>'+(sn?'<span class="s">'+hl(sn,hv)+'</span>':'')+'</div>';
    });
    var extra=[{t:d.lawsFor+" \u201c"+vt+"\u201d",k:"kLaw",u:"/know-the-laws",x:1},
               {t:d.shopFor+" \u201c"+vt+"\u201d",k:"kPage",u:"/shop?q="+encodeURIComponent(vt),x:1}];
    if(!hits.length)html+='<div class="rh">'+esc(d.noHits)+' \u201c'+esc(vt)+'\u201d</div>';
    extra.forEach(function(h){var i=hits.length;hits.push(h);
      html+='<div class="r rs" role="option" id="r'+i+'" aria-selected="'+(i===sel)+'" data-i="'+i+'"><span class="t">'+esc(h.t)+'</span><span class="k">'+esc(d[h.k])+'</span></div>'});
  }
  sel=Math.max(0,Math.min(sel,hits.length-1));
  box.innerHTML=html;
  mark();
  box.classList.add("open");q.setAttribute("aria-expanded","true");
}

function hide(){box.classList.remove("open");q.setAttribute("aria-expanded","false")}
function mark(){
  box.querySelectorAll("[data-i]").forEach(function(r){r.setAttribute("aria-selected",+r.dataset.i===sel)});
  q.setAttribute("aria-activedescendant","r"+sel);
  var el=$("r"+sel);if(el)el.scrollIntoView({block:"nearest"});
}
function open(i){
  var h=hits[i];if(!h)return;
  remember(q.value.trim());drawRecent();
  hide();
  if(h.u.indexOf("#s-")===0){q.blur();openSheet(h.u.slice(3))}else location.href=h.u;
}
q.addEventListener("input",function(){sel=0;render()});
q.addEventListener("focus",function(){sel=0;render()});
q.addEventListener("keydown",function(e){
  if(e.key==="ArrowDown"){e.preventDefault();if(!box.classList.contains("open"))render();sel=(sel+1)%hits.length;mark()}
  else if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+hits.length)%hits.length;mark()}
  else if(e.key==="Enter"){e.preventDefault();if(!box.classList.contains("open"))render();open(sel)}
  else if(e.key==="Tab"&&!e.shiftKey&&q.value.trim()&&hits[sel]&&!hits[sel].x){
    e.preventDefault();var h=hits[sel];q.value=(lang==="hi"&&h.th)?h.th:h.t;render()}
  else if(e.key==="Escape"){if(q.value){q.value="";render()}else{hide();q.blur()}}
});
box.addEventListener("mousedown",function(e){var r=e.target.closest("[data-i]");if(r){e.preventDefault();open(+r.dataset.i)}});
document.addEventListener("click",function(e){if(!e.target.closest(".search"))hide()});
$("go").onclick=function(){
  if(box.classList.contains("open")&&hits.length){open(sel)}
  else{q.focus()}
};
document.addEventListener("keydown",function(e){
  if(cur)return;
  var a=document.activeElement;
  if(e.key==="/"&&a!==q&&!/input|textarea/i.test(a.tagName)){e.preventDefault();q.focus()}
});


/* ---------------------------------------------------------- voice search
   Speech to text by the browser (assets/rr-voice.js: on-device first),
   then the same deterministic search as typing. Of the recogniser's
   guesses, the one this site understands best wins. */
(function(){
  var mic=$("mic"),msg=$("vmsg"),bar=document.querySelector(".bar");
  if(!mic||!window.RRVoice)return;
  var cloudNote=false;
  function say(text,err){msg.hidden=!text;msg.textContent=text||"";msg.classList.toggle("err",!!err)}
  function quality(a){var u=understand(a),r=rank(correct(u.text||a));return (r.length?r[0].s*(.6+.4*r[0].cov):0)+(u.intent?3:0)+(u.place?2:0)}
  RRVoice.attach(mic,{
    lang:function(){return lang==="hi"?"hi-IN":"en-IN"},
    pick:function(alts){var best=alts[0],bs=-1;alts.forEach(function(a){var q2=quality(a);if(q2>bs+1e-9){bs=q2;best=a}});return best},
    onNote:function(){cloudNote=true},
    onStart:function(m){say(m==="local"?T[lang].vLocal:T[lang].vListen);q.value="";q.focus();sel=0;render()},
    onState:function(on){bar.classList.toggle("listening",on);mic.setAttribute("aria-label",T[lang][on?"vStop":"vMic"])},
    onInterim:function(t){q.value=t;sel=0;render()},
    onFinal:function(t){q.value=t;sel=0;render()},
    onError:function(code){
      var d=T[lang],m={"not-allowed":d.vBlocked,"service-not-allowed":d.vBlocked,"no-speech":d.vNo,"audio-capture":d.vNoMic,"network":d.vNet}[code];
      say(m||d.vErr,true);hide();
    },
    onEnd:function(heard,errored){
      if(heard){say(T[lang].vHeard+" \u201c"+heard+"\u201d"+(cloudNote?"  \u00b7  "+T[lang].vCloud:""));cloudNote=false;remember(heard);drawRecent();q.focus();sel=0;render()}
      else if(!errored)say(T[lang].vNo,true);
    }
  });
  q.addEventListener("input",function(){if(!mic.classList.contains("on"))say("")});
})();

/* ------------------------------------------------------ recent searches */
function getRecent(){try{return JSON.parse(store.get("rr-recent")||"[]")}catch(e){return []}}
function remember(v){
  if(!v)return;var r=getRecent().filter(function(x){return x.toLowerCase()!==v.toLowerCase()});
  r.unshift(v);store.set("rr-recent",JSON.stringify(r.slice(0,4)));
}
function drawRecent(){
  var r=getRecent();$("recentRow").hidden=!r.length;
  $("recent").innerHTML=r.map(function(x,i){return '<button class="chip'+(i===0?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join("");
}
$("recent").addEventListener("click",function(e){var b=e.target.closest("button");if(b){q.value=b.dataset.v;sel=0;q.focus();render()}});
$("clear").onclick=function(){store.set("rr-recent","[]");drawRecent();q.focus()};

applyLang(lang);
drawRecent();
fromHash();
})();

</script>
