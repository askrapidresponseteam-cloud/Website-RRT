<style>
:root{
  --ink:#111;--mid:#5f6368;--low:#80868b;--line:#e3e3e3;--line-strong:#111;
  --bg:#fff;--red:#e52222;
  --serif:"Marcellus","Trajan Pro","Optima",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans Devanagari",system-ui,sans-serif;
  --pad:clamp(20px,7vw,120px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=hi] body{font-family:"Noto Sans Devanagari",var(--sans)}
html[lang=hi] .strip,html[lang=hi] nav a,html[lang=hi] .btn{letter-spacing:0;font-size:14px;font-weight:500}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* top strip */
.strip{flex:none;display:flex;align-items:center;justify-content:center;position:relative;
  height:38px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 44px;text-align:center}
.strip a{text-decoration:underline;text-underline-offset:3px}
.strip .x{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;font-size:18px;color:var(--mid)}
.strip.gone{display:none}

/* header */
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:24px;
  height:76px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .mark{width:26px;height:26px;flex:none;display:block}
@media (max-width:640px){.brand .mark{width:22px;height:22px}}
@media (max-width:360px){.brand span{display:none}}
nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,36px)}
nav a,.lang button{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
nav a:hover{text-decoration:underline;text-underline-offset:6px}
.lang{display:flex;align-items:center;gap:6px;color:var(--low)}
.lang button{color:var(--low);letter-spacing:.08em}
.lang button[aria-pressed=true]{color:var(--ink)}
.cta{position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 26px;
  font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  border:1px solid var(--ink);background:var(--bg);color:var(--ink);transition:background .15s,color .15s}
.btn:hover{background:#f4f4f4}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#333}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:#fff;border:1px solid var(--ink);display:none;z-index:30}
.menu.open{display:block}
.menu a{display:block;padding:12px 18px;font-size:14px}
.menu a+a{border-top:1px solid var(--line)}
.menu a:hover{background:#f4f4f4}

/* main */
main{flex:1 0 auto;display:flex;flex-direction:column;
  padding:clamp(12px,3vh,40px) var(--pad);width:100%;max-width:1480px;margin:0 auto}
.inner{width:100%;max-width:1200px;margin:auto}
h1{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:1.08;letter-spacing:.01em;white-space:pre-line;
  font-size:clamp(28px,min(4.6vw,6.4vh),62px)}
html[lang=hi] h1{font-family:"Noto Sans Devanagari",var(--serif);text-transform:none;font-weight:500}
.sub{margin-top:clamp(6px,1.2vh,14px);color:var(--mid);font-size:clamp(14px,1.9vh,17px);max-width:80ch}

.search{position:relative;margin-top:clamp(16px,3.6vh,44px)}
.bar{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line-strong)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);
  font-size:clamp(19px,min(2.6vw,4vh),34px);padding:clamp(4px,1vh,12px) 0;letter-spacing:-.005em}
.bar input::placeholder{color:#9aa0a6}
.go{flex:none;width:clamp(44px,6.2vh,60px);height:clamp(44px,6.2vh,60px);background:var(--ink);color:#fff;font-size:22px;margin-bottom:8px}
.go:hover{background:#333}
.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-top:0;
  box-shadow:0 12px 32px rgba(0,0,0,.08);z-index:20;display:none;max-height:min(420px,52vh);overflow:auto}
.results.open{display:block}
.r{display:flex;align-items:baseline;gap:14px;padding:12px 18px;cursor:pointer}
.r+.r{border-top:1px solid #f1f1f1}
.r[aria-selected=true],.r:hover{background:#f6f6f6}
.r .t{flex:1;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t mark{background:none;font-weight:600;color:inherit}
.r .k{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--low)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;margin-top:clamp(10px,1.8vh,18px);color:var(--mid);font-size:14px}
.chip{height:34px;padding:0 16px;border:1px solid var(--line);font-size:14px;color:var(--mid)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.hint{margin-top:clamp(6px,1.2vh,12px);color:var(--low);font-size:13.5px}

.label{color:var(--mid);font-size:14px;margin-bottom:clamp(6px,1.2vh,12px)}
.quick{margin-top:clamp(14px,3.2vh,40px)}
.qrow{display:flex;flex-wrap:wrap;gap:12px}

.asked{margin-top:clamp(14px,3.2vh,40px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:clamp(24px,4vw,64px)}
.item{display:block;padding:clamp(8px,1.5vh,16px) 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:400;font-size:clamp(15px,2vh,18px);color:var(--ink)}
.item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:var(--mid);font-size:clamp(13px,1.7vh,15px);line-height:1.5}
.item:hover b{text-decoration:underline;text-underline-offset:4px}


/* tabs */
.tabs{display:flex;gap:clamp(14px,2.2vw,30px);margin-bottom:0;border-bottom:1px solid var(--line)}
.tab{position:relative;padding:0 0 clamp(6px,1vh,10px);font-size:14px;color:var(--mid);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.tab:hover{color:var(--ink)}
.item{cursor:pointer;text-align:left;width:100%;display:flex!important;flex-direction:column;justify-content:flex-start;align-items:stretch;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit}
.item b,.item span{width:100%}
.item b:after{content:" \2192";opacity:0;transition:opacity .15s}
.item:hover b:after,.item:focus-visible b:after{opacity:1}
.grid{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;border-left:1px solid var(--ink)}
.sheet.open{transform:none}
.sh-top{flex:none;display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 28px;border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.sh-k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.sh-x{width:36px;height:36px;font-size:24px}
.sh-body{flex:1;overflow:auto;padding:28px 28px 20px}
.sh-body h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.1;text-transform:uppercase;margin-bottom:16px}
html[lang=hi] .sh-body h2{font-family:"Noto Sans Devanagari",var(--serif);text-transform:none;font-weight:500}
.sh-body p{color:#333;font-size:16px;margin-bottom:12px;max-width:52ch}
.sh-body p.em{color:var(--ink);font-weight:600}
.sh-body .sh-lt{margin:22px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.sh-list a,.sh-list div{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.sh-list b{display:block;font-weight:500;font-size:16px}
.sh-list span{display:block;color:var(--mid);font-size:14.5px}
.sh-list a:hover b{text-decoration:underline;text-underline-offset:4px}
.sh-act{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:16px 28px;border-top:1px solid var(--line);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sh-rel{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
body.lock{overflow:hidden}

footer{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;
  padding:14px var(--pad);border-top:1px solid var(--line);font-size:12.5px;color:var(--low)}
footer .links{display:flex;gap:18px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}

/* short screens: keep everything in one frame */
@media (max-height:940px){.hint{display:none}}
@media (max-height:860px){.item span{-webkit-line-clamp:1}}
@media (max-height:800px){.quick,.asked{margin-top:clamp(14px,3.4vh,26px)}}
@media (max-height:660px){.item span{display:none}}
@media (max-height:790px){.sub{display:none}.strip{height:32px}header{height:64px}}


/* tablet */
@media (max-width:1320px){.qrow{gap:10px}.qrow .btn{padding:0 16px;letter-spacing:.12em}}
@media (max-width:1180px) and (min-width:641px){.qrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.qrow::-webkit-scrollbar{display:none}.qrow .btn{flex:none}}
@media (max-width:1100px){nav .opt{display:none}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hint{display:none}}

/* phone */
@media (max-width:640px){
  body{font-size:14px}
  .strip{font-size:10px;letter-spacing:.1em;height:32px}
  header{height:60px;padding:0 18px}
  .brand{font-size:16px}
  nav{gap:10px}
  nav a{display:none}
  .menu a{display:block}
  .lang .sep,.lang button[aria-pressed=true]{display:none}
  .lang button{font-size:13px;padding:6px 4px}
  .strip .s2{display:none}
  .btn{height:40px;padding:0 14px;font-size:11px;letter-spacing:.12em}
  main{padding:14px 18px;justify-content:flex-start;padding-top:clamp(14px,4vh,40px)}
  h1{font-size:clamp(28px,8.4vw,40px)}
  .sub{font-size:14px}
  .hint{display:none}
  .quick .qrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
  .quick .qrow::-webkit-scrollbar{display:none}
  .tabs{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
  .tabs::-webkit-scrollbar{display:none}
  .grid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none;margin:0 -18px;padding:4px 18px 2px}
  .grid::-webkit-scrollbar{display:none}
  .grid .item,.grid .item:nth-child(n+4){display:block;flex:0 0 78%;scroll-snap-align:start;border:1px solid var(--line);padding:14px 16px}
  .item span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .sheet{top:auto;height:88dvh;width:100%;transform:translateY(100%);border-left:0;border-top:1px solid var(--ink)}
  .sh-top{height:56px;padding:0 20px;padding-top:0}
  .sh-body{padding:22px 20px 16px}
  .sh-act{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
  .sh-act .btn{flex:1 1 auto}
  footer{padding:10px 18px;font-size:11px}
  footer .links{display:none}
}
@media (max-width:640px) and (max-height:760px){.sub{display:none}.item span{-webkit-line-clamp:2}}
@media (max-width:640px) and (max-height:680px){.item span{-webkit-line-clamp:1}.label{display:none}}

/* ===== calm layout (Google-like): one centred column, one search, four actions ===== */
header{border-bottom:0;height:68px}
nav{gap:clamp(14px,2vw,26px)}
nav a{letter-spacing:.06em;text-transform:none;font-size:14px}
html[lang=hi] nav a{font-size:14px}
.langT{font-size:14px;color:var(--mid)}
.langT:hover{color:var(--ink)}
header .btn{height:40px;padding:0 18px;font-size:12px;border-radius:20px}
.menu{border-radius:12px;overflow:hidden}
main{justify-content:center}
.inner{max-width:720px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
h1{white-space:normal;max-width:none;text-transform:none;font-size:clamp(28px,min(3.7vw,6vh),46px);line-height:1.15;letter-spacing:0}
.search{width:100%;margin-top:clamp(22px,4.5vh,40px);text-align:left}
.bar{border:1px solid #dfe1e5;border-radius:28px;padding:0 6px 0 18px;height:54px;gap:10px;transition:box-shadow .15s,border-color .15s}
.bar:hover,.bar:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.sico{width:20px;height:20px;flex:none;color:#9aa0a6}
.bar input{font-size:17px;padding:0;height:100%}
.go{width:42px;height:42px;margin:0;border-radius:50%;font-size:18px}
.results{border-radius:0 0 22px 22px;border:0;box-shadow:0 6px 16px rgba(32,33,36,.18);top:calc(100% - 4px);padding:6px 0 10px}
.search:has(.results.open) .bar{border-radius:26px 26px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.18);border-color:transparent}
.r{padding:10px 22px}
.meta{justify-content:center;margin-top:14px}
.qrow{justify-content:center;gap:10px;margin-top:clamp(20px,4vh,32px);flex-wrap:wrap}
.qrow .btn{height:40px;padding:0 18px;font-size:12px;letter-spacing:.12em;border-radius:20px}
.learn{margin-top:clamp(18px,3.5vh,30px);font-size:14px;color:var(--low);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.learn button{color:var(--mid);font-size:14px}
.learn button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.learn i{font-style:normal;color:#c4c7c5}
footer{background:#f6f6f6;border-top:1px solid var(--line);color:var(--mid);font-size:13px;padding:14px var(--pad)}
footer .links{gap:22px}
@media (max-width:640px){
  header{height:58px}
  nav{gap:12px}
  nav a{font-size:13px}
  .inner{justify-content:flex-start}
  main{padding-top:clamp(40px,10vh,90px)}
  h1{font-size:clamp(26px,7.4vw,34px)}
  .bar{height:48px;padding-left:14px}
  .bar input{font-size:16px}
  .go{width:38px;height:38px}
  .qrow{flex-wrap:wrap;overflow:visible;margin:22px 0 0;padding:0}
  .qrow .btn{flex:0 0 auto;height:38px;padding:0 14px;font-size:11px}
  footer{flex-direction:column;align-items:center;text-align:center}
  footer .links{display:flex;justify-content:center;gap:14px;font-size:12px}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="/" aria-label="Rapid Response home"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#ff4d3d"/><g fill="#fff"><ellipse cx="25.5" cy="33.5" rx="6.8" ry="9.3"/><ellipse cx="43.5" cy="27.5" rx="7.3" ry="10"/><ellipse cx="63.5" cy="31" rx="7" ry="9.6"/><ellipse cx="79" cy="43" rx="6" ry="8.3"/><ellipse cx="50" cy="68.3" rx="25.5" ry="16.3"/><ellipse cx="50" cy="60" rx="20" ry="12"/></g></svg><span>Rapid Response</span></a>
  <nav aria-label="Main">
    <a href="/know-the-laws" data-i="navLaws" class="opt"></a>
    <a href="/faq" data-i="navFaq" class="opt"></a>
    <a href="/shop" data-i="navShop"></a>
    <button class="langT" id="langT" data-i="otherLang" lang="hi"></button>
    <div class="cta">
      <button class="btn dark" id="appBtn" aria-haspopup="true" aria-expanded="false" data-i="getApp"></button>
      <div class="menu" id="appMenu">
        <a href="https://play.google.com/store/apps/details?id=com.rrt.sos" rel="noopener">Android - Google Play</a>
        <a href="https://apps.apple.com/in/app/rapid-response/id6758672498" rel="noopener">iPhone - App Store</a>
        <a href="/app-guide" data-i="menuGuide"></a>
      </div>
    </div>
  </nav>
</header>

<main>
 <div class="inner">
  <h1 data-i="h1"></h1>

  <div class="search" role="search">
    <div class="bar">
      <svg class="sico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search Rapid Response">
      <button class="go" id="go" aria-label="Go">&rarr;</button>
    </div>
    <div class="results" id="results" role="listbox"></div>
  </div>

  <div class="meta" id="recentRow" hidden>
    <span data-i="recent"></span>
    <span id="recent" style="display:contents"></span>
    <button class="chip" id="clear" data-i="clear"></button>
  </div>

  <div class="qrow">
    <a class="btn dark" href="/report" data-i="qReport"></a>
    <button class="btn" data-sheet="sos" data-i="qSos"></button>
    <a class="btn" href="/know-the-laws" data-i="qLaws"></a>
    <a class="btn" href="/shop" data-i="qShop"></a>
  </div>

  <p class="learn">
    <button data-sheet="ask" data-i="lApp"></button><i>·</i><button data-sheet="roles" data-i="lWho"></button><i>·</i><button data-sheet="gap" data-i="lWhy"></button><i>·</i><button data-sheet="promises" data-i="lPro"></button>
  </p>
 </div>
</main>

<footer>
  <span data-i="footL"></span>
  <span class="links">

  if(cur)return;
  var a=document.activeElement;
  if(e.key==="/"&&a!==q&&!/input|textarea/i.test(a.tagName)){e.preventDefault();q.focus()}
});

/* ------------------------------------------------------ recent searches */
function getRecent(){try{return JSON.parse(store.get("rr-recent")||"[]")}catch(e){return []}}
function remember(v){
  if(!v)return;var r=getRecent().filter(function(x){return x.toLowerCase()!==v.toLowerCase()});
  r.unshift(v);store.set("rr-recent",JSON.stringify(r.slice(0,4)));
}
function drawRecent(){
  var r=getRecent();$("recentRow").hidden=!r.length;
  $("recent").innerHTML=r.map(function(x,i){return '<button class="chip'+(i===0?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join("");
}
$("recent").addEventListener("click",function(e){var b=e.target.closest("button");if(b){q.value=b.dataset.v;sel=0;q.focus();render()}});
$("clear").onclick=function(){store.set("rr-recent","[]");drawRecent();q.focus()};

applyLang(lang);
drawRecent();
fromHash();
})();

</script>
</body>
</html>
